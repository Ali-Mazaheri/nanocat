name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests and smoke tests
        run: |
          python3 -m py_compile nanocat
          python3 -m unittest discover -s tests -v
          chmod +x nanocat
          ./nanocat --list > /dev/null
          ./nanocat -n -r 1:10 nanocat > /dev/null
