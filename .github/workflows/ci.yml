name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and smoke-test nanocat
        run: |
          python3 -m py_compile nanocat
          chmod +x nanocat
          ./nanocat --list > /dev/null
          ./nanocat nanocat > /dev/null
